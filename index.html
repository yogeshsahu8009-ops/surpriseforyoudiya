
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Diya ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at top, #54245f, #160d2c 65%, #080817);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
}

/* Background stars */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(white 1px, transparent 1px),
      radial-gradient(#ff9ed2 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    background-position: 0 0, 40px 60px;
    opacity: 0.35;
    animation: starsMove 25s linear infinite;
}

@keyframes starsMove {
    to {
        background-position: 300px 300px, 200px 200px;
    }
}

/* Main container */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 35px 18px;
}

/* Heading */

.small-heading {
    color: #ffc5e4;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 20px;
}

h1 {
    color: #ff9bd3;
    font-size: clamp(32px, 8vw, 65px);
    text-shadow: 0 0 15px #ff4fae,
                 0 0 35px #ff4fae;
    animation: headingGlow 2s infinite alternate;
}

@keyframes headingGlow {
    to {
        text-shadow: 0 0 25px #ff4fae,
                     0 0 60px #ff4fae;
    }
}

/* 3D cake */

.cake {
    font-size: 90px;
    margin: 25px 0;
    display: inline-block;
    animation: cakeFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 15px 15px #ff4fae55);
}

@keyframes cakeFloat {
    0%, 100% {
        transform: translateY(0) rotateY(0deg);
    }
    50% {
        transform: translateY(-15px) rotateY(12deg);
    }
}

/* Glass card */

.card {
    width: 100%;
    max-width: 650px;
    padding: 35px 25px;
    border: 1px solid #ff9bd355;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px #0005,
                inset 0 0 25px #ff9bd311;
    transform-style: preserve-3d;
    animation: cardEnter 1.5s ease;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: perspective(800px) rotateX(20deg) translateY(40px);
    }
    to {
        opacity: 1;
        transform: perspective(800px) rotateX(0deg) translateY(0);
    }
}

/* Animated writing */

#animatedTitle {
    font-size: clamp(22px, 5vw, 35px);
    line-height: 1.5;
    color: #ffd4ed;
    min-height: 55px;
}

#animatedText {
    color: #ffffff;
    font-size: 17px;
    line-height: 1.9;
    margin-top: 20px;
    min-height: 100px;
}

.cursor {
    display: inline-block;
    color: #ff8ac8;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* Buttons */

button {
    border: none;
    outline: none;
    padding: 14px 28px;
    margin: 12px 7px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #ff4fae, #a63bdb);
    box-shadow: 0 5px 25px #ff4fae66;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 10px 35px #ff4fae99;
}

.buttons {
    margin-top: 25px;
}

/* Floating hearts */

.heart {
    position: fixed;
    bottom: -40px;
    z-index: 1;
    pointer-events: none;
    animation: heartFloat linear forwards;
}

@keyframes heartFloat {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Footer */

.footer {
    margin-top: 30px;
    color: #e7b9dc;
    font-size: 13px;
}

/* Mobile */

@media(max-width: 600px) {
    .card {
        padding: 25px 18px;
    }

    #animatedText {
        font-size: 15px;
    }

    .cake {
        font-size: 75px;
    }
}
</style>
</head>

<body>

<div class="stars"></div>

<main class="container">

    <p class="small-heading">A SPECIAL SURPRISE FOR YOU ✨</p>

    <h1>Happy Birthday Diya!</h1>

    <div class="cake">🎂</div>

    <section class="card">

        <h2 id="animatedTitle"></h2>

        <p id="animatedText"></p>

        <div class="buttons">

            <button onclick="replayMessage()">
                Read Again ❤️
            </button>

            <button onclick="celebrate()">
                More Surprises 🎉
            </button>

        </div>

    </section>

    <p class="footer">
        Made with ❤️ for Diya
    </p>

</main>

<script>

/* Birthday messages */

const titleMessage = "Dear Diya ❤️";

const birthdayMessage =
"Today is your special day! 🎂 " +
"May your life always be filled with happiness, " +
"beautiful memories, endless smiles and wonderful surprises. " +
"Keep shining and keep being the amazing person you are. " +
"Wishing you a very Happy Birthday! 💗✨";

/* Typing animation */

let animationVersion = 0;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeMessage(element, text, speed, version) {

    element.textContent = "";

    for (const character of text) {

        if (version !== animationVersion) return;

        element.textContent += character;

        await sleep(speed);
    }
}

async function replayMessage() {

    animationVersion++;

    const version = animationVersion;

    const title = document.getElementById("animatedTitle");
    const message = document.getElementById("animatedText");

    message.textContent = "";

    await typeMessage(title, titleMessage, 110, version);

    if (version !== animationVersion) return;

    await sleep(500);

    await typeMessage(message, birthdayMessage, 45, version);
}

/* Floating hearts */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = ["❤️", "💗", "💕", "💖", "✨"];

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    const duration = 5 + Math.random() * 5;

    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, duration * 1000);
}

setInterval(createHeart, 500);

/* Celebration */

function celebrate() {

    const emojis = ["🎉", "🎊", "💖", "✨", "🌸", "❤️"];

    for (let i = 0; i < 45; i++) {

        setTimeout(() => {

            const item = document.createElement("div");

            item.className = "heart";

            item.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            item.style.left = Math.random() * 100 + "vw";

            item.style.fontSize = "25px";

            item.style.animationDuration = "4s";

            document.body.appendChild(item);

            setTimeout(() => item.remove(), 4000);

        }, i * 60);
    }
}

/* Start */

window.addEventListener("DOMContentLoaded", () => {
    replayMessage();
});

</script>

</body>
</html>
