
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Diya ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(circle at top, #63316e, #21132e 65%, #090817);
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

/* BACKGROUND STARS */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#ff9ed2 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    background-position: 0 0, 40px 60px;
    opacity: .4;
    animation: starsMove 25s linear infinite;
}

@keyframes starsMove {
    to {
        background-position: 300px 300px, 200px 200px;
    }
}

/* MAIN CONTAINER */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
    text-align: center;
}

/* TOP TEXT */

.small-heading {
    color: #ffc5e4;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 20px;
}

/* MAIN HEADING */

h1 {
    color: #ff9bd3;
    font-size: clamp(32px, 8vw, 65px);
    text-shadow: 0 0 15px #ff4fae, 0 0 35px #ff4fae;
    animation: headingGlow 2s infinite alternate;
}

@keyframes headingGlow {
    to {
        text-shadow: 0 0 25px #ff4fae, 0 0 60px #ff4fae;
    }
}

/* BIRTHDAY CAKE */

.cake {
    font-size: 95px;
    margin: 25px 0;
    display: inline-block;
    animation: cakeFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 15px 15px #ff4fae55);
}

@keyframes cakeFloat {
    0%, 100% {
        transform: translateY(0) rotateY(0deg);
    }
    50% {
        transform: translateY(-15px) rotateY(15deg);
    }
}

/* MAIN GLASS CARD */

.card {
    width: 100%;
    max-width: 650px;
    padding: 35px 25px;
    border: 1px solid #ff9bd355;
    border-radius: 25px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px #0005, inset 0 0 25px #ff9bd311;
    transform-style: preserve-3d;
    animation: cardEnter 1.5s ease;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: perspective(800px) rotateX(20deg) translateY(40px);
    }
    to {
        opacity: 1;
        transform: perspective(800px) rotateX(0) translateY(0);
    }
}

/* TYPING TEXT */

#animatedTitle {
    color: #ffd4ed;
    font-size: clamp(22px, 5vw, 35px);
    line-height: 1.5;
    min-height: 55px;
    text-shadow: 0 0 15px #ff75bd;
}

#animatedText {
    color: white;
    font-size: 17px;
    line-height: 1.9;
    margin-top: 20px;
    min-height: 110px;
}

/* BUTTON */

button {
    border: none;
    outline: none;
    padding: 15px 30px;
    margin-top: 25px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #ff4fae, #a63bdb);
    box-shadow: 0 5px 25px #ff4fae66;
    transition: .3s;
}

button:hover {
    transform: translateY(-4px) scale(1.06);
    box-shadow: 0 10px 35px #ff4fae99;
}

button:disabled {
    opacity: .7;
    cursor: default;
}

/* EXTRA SURPRISE */

.extra-surprise {
    display: none;
    margin-top: 30px;
    padding: 25px 15px;
    border-radius: 20px;
    background: rgba(255,130,200,.12);
    border: 1px solid rgba(255,150,220,.4);
    box-shadow: 0 0 25px rgba(255,80,180,.25);
}

.extra-surprise h2 {
    color: #ff9bd3;
    font-size: 27px;
    text-shadow: 0 0 20px #ff4fae;
    margin-bottom: 15px;
    line-height: 1.5;
}

.extra-surprise p {
    color: white;
    font-size: 16px;
    line-height: 1.9;
}

/* FLOATING HEARTS AND CONFETTI */

.heart {
    position: fixed;
    bottom: -40px;
    z-index: 5;
    pointer-events: none;
    animation: heartFloat linear forwards;
}

@keyframes heartFloat {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* FOOTER */

.footer {
    margin-top: 30px;
    color: #e7b9dc;
    font-size: 13px;
}

/* MOBILE RESPONSIVE */

@media(max-width: 600px) {

    .card {
        padding: 25px 18px;
    }

    #animatedText {
        font-size: 15px;
    }

    .cake {
        font-size: 75px;
    }

    .extra-surprise h2 {
        font-size: 23px;
    }
}

</style>
</head>

<body>

<div class="stars"></div>

<main class="container">

    <p class="small-heading">
        A SPECIAL SURPRISE FOR YOU ✨
    </p>

    <h1>Happy Birthday Diya!</h1>

    <div class="cake">🎂</div>

    <section class="card">

        <h2 id="animatedTitle"></h2>

        <p id="animatedText"></p>

        <button id="surpriseButton" onclick="celebrate()">
            More Surprises 🎉
        </button>

        <div id="extraSurprise" class="extra-surprise">

            <h2 id="surpriseTitle"></h2>

            <p id="surpriseMessage"></p>

        </div>

    </section>

    <p class="footer">
        Made with ❤️ for Diya
    </p>

</main>

<script>

/* MAIN BIRTHDAY MESSAGES */

const titleMessage = "Dear Diya ❤️";

const birthdayMessage =
"Today is your special day! 🎂 " +
"May your life always be filled with happiness, " +
"beautiful memories, endless smiles and wonderful surprises. " +
"Keep shining and keep being the amazing person you are. " +
"Wishing you a very Happy Birthday! 💗✨";

/* EXTRA SURPRISE MESSAGES */

const extraTitle =
"A Special Wish For You, Diya ❤️";

const extraMessage =
"You deserve all the happiness, love and beautiful moments in this world. " +
"May your smile always shine and your dreams come true. " +
"Never stop being the wonderful person you are. " +
"Happy Birthday once again, Diya! 💗🎂✨";

/* TYPING ANIMATION */

let animationVersion = 0;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeMessage(element, text, speed, version) {

    element.textContent = "";

    for (const character of text) {

        if (version !== animationVersion) return;

        element.textContent += character;

        await sleep(speed);
    }
}

/* START BIRTHDAY MESSAGE */

async function startBirthdayMessage() {

    const version = ++animationVersion;

    const title = document.getElementById("animatedTitle");
    const message = document.getElementById("animatedText");

    await typeMessage(title, titleMessage, 100, version);

    if (version !== animationVersion) return;

    await sleep(500);

    await typeMessage(message, birthdayMessage, 40, version);
}

/* FLOATING HEARTS */

function createFloatingEmoji(emoji, duration = 5) {

    const item = document.createElement("div");

    item.className = "heart";
    item.textContent = emoji;

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (18 + Math.random() * 25) + "px";
    item.style.animationDuration = duration + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), duration * 1000);
}

/* CONTINUOUS HEARTS */

setInterval(() => {

    const hearts = ["❤️", "💗", "💕", "💖", "✨"];

    const emoji = hearts[
        Math.floor(Math.random() * hearts.length)
    ];

    createFloatingEmoji(emoji, 7);

}, 600);

/* MORE SURPRISE BUTTON */

let surpriseOpened = false;

async function celebrate() {

    if (surpriseOpened) return;

    surpriseOpened = true;

    const button = document.getElementById("surpriseButton");
    const surprise = document.getElementById("extraSurprise");
    const title = document.getElementById("surpriseTitle");
    const message = document.getElementById("surpriseMessage");

    button.disabled = true;
    button.textContent = "A Surprise For You! ❤️";

    surprise.style.display = "block";

    // Celebration particles

    const emojis = ["🎉", "🎊", "💖", "✨", "🌸", "❤️", "🥳"];

    for (let i = 0; i < 50; i++) {

        setTimeout(() => {

            const emoji = emojis[
                Math.floor(Math.random() * emojis.length)
            ];

            createFloatingEmoji(emoji, 4);

        }, i * 70);
    }

    // Animated writing of second message

    await sleep(400);

    await typeMessage(
        title,
        extraTitle,
        75,
        -1
    );

    // Type second message

    for (const character of extraMessage) {

        message.textContent += character;

        await sleep(45);
    }

    button.textContent = "You Are Special, Diya! 💗";
}

/* START WHEN WEBSITE OPENS */

window.addEventListener("DOMContentLoaded", () => {

    startBirthdayMessage();

});

</script>

</body>
</html>
